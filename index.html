<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#06100b">
    <meta name="description" content="منوی دیجیتال کافه نوو">

    <title>CAFE NEVO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="grain"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

    <button
        class="mini-brand"
        id="homeLogo"
        type="button"
    >
        <img src="logo.jpg" alt="Cafe Nevo">
        <span>CAFE NEVO</span>
    </button>

    <a
        class="instagram-mini"
        href="https://instagram.com/cafe.nevo"
        target="_blank"
        rel="noopener noreferrer"
    >
        @cafe.nevo
    </a>

</header>


<main>


<!-- =====================================================
     PAGE 1 — LOBBY
===================================================== -->

<section
    class="page lobby-page active-page"
    id="homePage"
>

    <div class="lobby-orb orb-one"></div>
    <div class="lobby-orb orb-two"></div>

    <div class="lobby-content">

        <div class="lobby-logo">

            <img
                src="logo.jpg"
                alt="لوگوی کافه نوو"
            >

        </div>

        <span class="lobby-eyebrow">
            YOUR MOMENT · YOUR MOOD · YOUR NEVO
        </span>

        <h1>
            CAFE NEVO
        </h1>

        <p class="lobby-persian">
            طعمی نو با کافه نوو
        </p>

        <button
            class="menu-open-button"
            id="openMenu"
            type="button"
        >

            <span>

                <small>
                    EXPLORE
                </small>

                <strong>
                    منوی نوو
                </strong>

            </span>

            <b>
                ↗
            </b>

        </button>

    </div>


    <div class="lobby-bottom">

        <span>
            LOK JAM · ALMAS PASSAGE · 3F
        </span>

        <span>
            CAFE NEVO
        </span>

    </div>


    <div class="scroll-indicator">

        <span>
            SCROLL
        </span>

        <i></i>

    </div>

</section>



<!-- =====================================================
     PAGE 2 — CATEGORIES
===================================================== -->

<section
    class="page categories-page"
    id="categoriesPage"
>

    <div class="categories-background"></div>

    <div class="categories-inner">


        <div class="categories-header">

            <button
                class="page-nav-button"
                id="categoriesBack"
                type="button"
            >
                ‹
            </button>


            <button
                class="categories-logo"
                id="categoriesLogo"
                type="button"
            >

                <img
                    src="logo.jpg"
                    alt="Cafe Nevo"
                >

            </button>


            <button
                class="page-nav-button search-button"
                id="searchButton"
                type="button"
            >
                ⌕
            </button>

        </div>



        <div class="categories-title">

            <span>
                CAFE NEVO
            </span>


            <div class="title-with-lines">

                <i></i>

                <h2>
                    MENU
                </h2>

                <i></i>

            </div>


            <p>
                Choose your favorite
            </p>

        </div>



        <div
            class="category-cards"
            id="categoryCards"
        ></div>



        <div class="category-end">

            <span></span>

            <b>
                NEVO
            </b>

            <span></span>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 3 — PRODUCTS
===================================================== -->

<section
    class="page products-page"
    id="productsPage"
>

    <div class="products-inner">


        <div class="products-top">

            <button
                class="products-back"
                id="productsBack"
                type="button"
            >
                ← دسته‌بندی‌ها
            </button>


            <button
                class="products-logo"
                id="productsLogo"
                type="button"
            >

                <img
                    src="logo.jpg"
                    alt="Cafe Nevo"
                >

            </button>

        </div>



        <div class="products-heading">

            <span>
                CAFE NEVO · MENU
            </span>

            <h2 id="productCategoryTitle">
                بار گرم
            </h2>

            <p id="productCategoryEnglish">
                HOT DRINKS
            </p>

        </div>



        <div class="category-line-wrapper">

            <div
                class="category-line"
                id="categoryLine"
            ></div>

        </div>



        <div
            class="products-list"
            id="productsList"
        ></div>

    </div>

</section>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-brand">

        <img
            src="logo.jpg"
            alt="Cafe Nevo"
        >

        <span>
            CAFE NEVO
        </span>

    </div>


    <div class="footer-location">
        LOK JAM · ALMAS PASSAGE · 3RD FLOOR
    </div>


    <a
        href="https://instagram.com/cafe.nevo"
        target="_blank"
        rel="noopener noreferrer"
    >
        @cafe.nevo
    </a>

</footer>


<script src="script.js"></script>

</body>
</html>
